services:
  postgres:
    image: postgres:16-alpine
    container_name: hospital_ai_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-hospital_ai}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hospital_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: hospital_ai_backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-hospital_ai}
      ALLOW_DEMO_AUTH: ${ALLOW_DEMO_AUTH:-true}
      DEMO_JWT_SECRET: ${DEMO_JWT_SECRET:-local-dev-demo-jwt-secret-change-in-production-32chars}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-HospitalDemo!2026}
      CONFIRMATION_TOKEN_SECRET: ${CONFIRMATION_TOKEN_SECRET:-local-dev-confirmation-secret-change-in-prod-32chars}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
        VITE_ENABLE_DEMO_LOGIN: "true"
    container_name: hospital_ai_frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:

